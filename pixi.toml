[workspace]
channels = ["https://conda.modular.com/max", "https://repo.prefix.dev/modular-community", "conda-forge"]
name = "roboquant"
platforms = ["osx-arm64"]
version = "0.2.0"

[tasks]
build = "pixi run mojo precompile -I lib roboquant/ -o lib/roboquant.mojoc"
demo = { cmd = "pixi run mojo -I lib tests/demo_chart.mojo", depends-on = ["build"]}
perf = { cmd = "pixi run mojo -I lib tests/test_run.mojo", depends-on = ["build"]}
test = { cmd = "./tests/run_tests.sh", depends-on = ["build"]}



[dependencies]
mojo = "==1.2.0"
decimo = ">=0.16.0,<0.17"
python = "==3.14"
matplotlib = ">=3.11.2,<4"
numpy = ">=2.5.3,<3"

